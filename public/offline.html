<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — Heartwise</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ef; color: #171717; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { font-family: Georgia, serif; font-weight: 500; font-size: 2rem; margin: 20px 0 8px; }
        p { color: #525252; max-width: 22rem; margin: 0 auto 20px; }
        button { background: #171717; color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 1rem; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Check your internet connection, then try again. Your matches and messages will be right here.</p>
        <button onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
